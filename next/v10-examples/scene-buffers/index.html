<body>
  <div id="scene" aria-label="Interactive Riverfront Selection Outline"></div>
  <aside class="luma-example-infobox luma-example-infobox--overlay">
    <p class="eyebrow">luma.gl + deck.gl</p><h1>Riverfront Selection Outline</h1>
    <section class="control-card"><h2>Scene</h2>
      <label>Renderer<select id="backend" aria-label="Renderer"><option value="webgpu">WebGPU</option></select></label>
      <label>View<select id="mode"><option value="scene">Final image</option><option value="normals">Surface normals</option><option value="depth">Depth</option><option value="selection">Selected building</option><option value="previous">Previous frame</option></select></label>
      <label class="toggle"><input id="glass" type="checkbox" checked /> Glass pavilion</label>
    </section>
    <section class="control-card"><h2>Light and edges</h2>
      <label class="toggle"><input id="bloom" type="checkbox" checked /> Bloom</label>
      <label>Glow strength<input id="strength" type="range" min="0" max="2" step="0.05" value="0.5" /></label>
      <label class="toggle"><input id="edges" type="checkbox" /> Surface edges</label>
      <label class="toggle"><input id="selection" type="checkbox" checked /> Selection outline</label>
    </section>
    <section class="control-card"><h2>History</h2>
      <button id="reset-history" type="button">Reset previous frame</button>
      <p class="hint">Previous frame shows the last rendered view. Move the camera to compare.</p>
    </section>
    <output id="selected" class="selection" aria-live="polite">East 4.1</output>
    <p class="hint" id="status">Click a building to highlight it.<br />Drag to move · Scroll to zoom<br />Shift + drag to orbit · WebGPU</p>
  </aside>
</body>
</html>
