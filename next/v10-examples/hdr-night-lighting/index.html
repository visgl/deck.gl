<body>
  <div id="scene" aria-label="Riverfront HDR night lighting"></div>
  <aside class="luma-example-infobox luma-example-infobox--overlay">
    <p class="eyebrow">luma.gl + deck.gl</p><h1>Riverfront HDR night lighting</h1>
    <section class="control-card"><h2>Scene</h2>
      <label>Device<select id="backend" aria-label="Device"><option value="webgpu">WebGPU</option></select></label>
      <label class="toggle">Animate<input id="animate" type="checkbox" checked /></label>
      <button id="center" type="button">Center</button>
    </section>
    <section class="control-card"><h2>Lighting</h2><label>Light radiance<input id="radiance" type="range" min="1" max="24" step="1" /></label><label class="toggle">Bloom<input id="bloom" type="checkbox" checked /></label><label class="toggle">Auto exposure<input id="autoExposure" type="checkbox" checked /></label><label>Exposure<input id="exposure" type="range" min="0.2" max="3" step="0.1" /></label></section>
    <section class="control-card"><h2>Shared buffers</h2><label>View<select id="buffer-view"><option value="0">Scene</option><option value="1">Normals</option><option value="2">Depth</option><option value="3">Motion</option></select></label></section>
    <output id="status" class="selection" aria-live="polite">Preparing the riverfront…</output>
    <p class="hint">Scene-linear point lights, multiscale bloom and smooth exposure adaptation.<br />Drag to move · Scroll to zoom · Shift + drag to orbit</p>
  </aside>
