<!doctype html>
<html lang="en">
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="deck/flow-particles" />
  <meta name="luma-example-backends" content="webgpu,webgl2" />
  <meta name="luma-example-mobile" content="full" />
  <meta name="luma-example-mobile-profile" content="standard" />
  <!-- /luma-example-support -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Riverfront flow · luma.gl</title>
  <script type="module" crossorigin src="/next/v10-examples/assets/flow-particles-PeZZeEBB.js"></script>
  <link rel="modulepreload" crossorigin href="/next/v10-examples/assets/deck-example-device-TQPRJnZ6.js">
  <link rel="modulepreload" crossorigin href="/next/v10-examples/assets/example-support-KHcxfZf7.js">
  <link rel="modulepreload" crossorigin href="/next/v10-examples/assets/project32-Byi-VnKS.js">
  <link rel="modulepreload" crossorigin href="/next/v10-examples/assets/river-district-data-C9FvyLLC.js">
  <link rel="modulepreload" crossorigin href="/next/v10-examples/assets/riverfront-view-CB3JCqMN.js">
  <link rel="modulepreload" crossorigin href="/next/v10-examples/assets/meter-offset-position-CMR-ehQ5.js">
  <link rel="modulepreload" crossorigin href="/next/v10-examples/assets/lambert-material-DjV_YOPi.js">
  <link rel="modulepreload" crossorigin href="/next/v10-examples/assets/river-district-layer-DuhH2l43.js">
  <link rel="stylesheet" crossorigin href="/next/v10-examples/assets/flow-particles-DTs6-QtA.css">
</head>
<body>
  <div id="scene" aria-label="Interactive river flow"></div>
  <aside class="luma-example-infobox luma-example-infobox--overlay">
    <p class="eyebrow">luma.gl + deck.gl</p><h1>Riverfront flow</h1>
    <section class="control-card"><h2>Scene</h2>
      <label>Renderer<select id="backend"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2</option></select></label>
      <label class="toggle"><input id="playing" type="checkbox" checked /> Animate</label>
      <label>Field<select id="field"><option value="river">River current</option><option value="eddies">Eddies</option><option value="missing">Missing samples</option><option value="changing">Changing currents</option></select></label>
      <label class="toggle"><input id="northern-section" type="checkbox" checked /> Northern section</label>
    </section>
    <section class="control-card"><h2>Particles</h2>
      <label>Density<select id="count"><option value="2048" selected>2,048</option><option value="8192">8,192</option><option value="32768">32,768</option></select></label>
      <label>Time scale<input id="speed" type="range" min="0.25" max="8" step="0.25" value="2" /></label>
      <label>Trail (s)<input id="trail" type="range" min="0" max="12" step="0.1" value="6" /></label>
      <label>Width (px)<input id="width" type="range" min="0.5" max="4" step="0.25" value="1.5" /></label>
      <button id="reset" type="button">Reset particles</button>
    </section>
    <output id="selection" class="selection" aria-live="polite">Click a particle to inspect</output>
    <p class="hint" id="status">GPU advection · velocities in metres/second.<br />Drag to move · Scroll to zoom<br />Shift + drag to orbit</p>
  </aside>
</body>
</html>
