<!doctype html>
<script type="module">
  import {createArrowPathLayerDeck} from './app.ts';
  import {resolveDeckExampleDeviceType} from '../deck-example-device.ts';
  const deviceSelect = document.querySelector('#deck-device');
  deviceSelect.value = await resolveDeckExampleDeviceType(
    new URLSearchParams(location.search).get('backend')
  );
  let example = createArrowPathLayerDeck(undefined, {deviceType: deviceSelect.value});
  deviceSelect.addEventListener('change', () => {
    example.finalize();
    example = createArrowPathLayerDeck(undefined, {deviceType: deviceSelect.value});
  });
</script>
<body style="margin: 0; font: 14px system-ui, sans-serif;">
  <label style="position: fixed; top: 12px; left: 12px; z-index: 10; padding: 8px 10px; background: white; font: 14px sans-serif;">
    Device
    <select id="deck-device">
      <option value="webgpu">WebGPU</option>
      <option value="webgl">WebGL2</option>
    </select>
  </label>
  <aside style="position: fixed; top: 64px; right: 12px; z-index: 10; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 76px); overflow: auto; padding: 12px; box-sizing: border-box; background: white; border: 1px solid #ddd; border-radius: 8px;">
    <div id="arrow-example-panel-host" data-example-panel-host=""></div>
  </aside>
</body>
