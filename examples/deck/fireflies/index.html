<!doctype html>
<html lang="en">
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="deck/fireflies" />
  <meta name="luma-example-backends" content="webgpu,webgl2" />
  <meta name="luma-example-mobile" content="full" />
  <meta name="luma-example-mobile-profile" content="standard" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document.querySelectorAll('script[type="module"]:not([data-luma-example-support-bootstrap])').forEach(script => script.remove());
    }
  </script>
  <!-- /luma-example-support -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
  <title>Riverfront lights and fireflies · luma.gl</title>
</head>
<body>
  <div id="scene" aria-label="Riverfront lights and fireflies"></div>
  <aside class="luma-example-infobox luma-example-infobox--overlay">
    <p class="eyebrow">luma.gl + deck.gl</p><h1>Riverfront lights and fireflies</h1>
    <section class="control-card"><h2>Scene</h2>
      <label>Device<select id="backend" aria-label="Device"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2</option></select></label>
      <label class="toggle">Animate<input id="animate" type="checkbox" checked /></label>
      <button id="center" type="button">Center</button>
    </section>
    <section class="control-card"><h2>Lighting</h2><label class="toggle">Lampposts<input id="lamps" type="checkbox" checked /></label><label>Lamp radiance<input id="radiance" type="range" min="0" max="8" step="0.1" /></label><label>Species<select id="species" aria-label="Species"></select></label><label class="toggle">Fireflies<input id="enabled" type="checkbox" checked /></label><label>Firefly size<input id="radius" type="range" min="1" max="8" step="0.25" /></label><label>Glow strength<input id="intensity" type="range" min="0.1" max="3" step="0.1" /></label><label>Flight speed<input id="speed" type="range" min="0" max="2" step="0.05" /></label><label class="toggle">Bloom<input id="bloom" type="checkbox" checked /></label><label>Bloom strength<input id="bloomStrength" type="range" min="0" max="3" step="0.05" /></label><label>Exposure<input id="exposure" type="range" min="0.2" max="3" step="0.1" /></label></section>
    <section class="control-card"><h2>Water</h2><label class="toggle">Reflections<input id="reflections" type="checkbox" checked /></label><label>Surface ripples<input id="ripples" type="range" min="0" max="0.4" step="0.01" /></label></section>
    <section class="control-card"><h2>Shared buffers</h2><label>View<select id="buffer-view"><option value="0">Scene</option><option value="1">Normals</option><option value="2">Depth</option><option value="3">Motion</option></select></label></section>
    <output id="status" class="selection" aria-live="polite">Preparing the riverfront…</output>
    <p class="hint">Species selects an approximate emission color; flashing patterns are illustrative.<br />Drag to move · Scroll to zoom · Shift + drag to orbit</p>
  </aside><script type="module" src="./main.ts"></script>
</body></html>
