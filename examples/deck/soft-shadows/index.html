<!doctype html>
<html lang="en">
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="deck/soft-shadows" />
  <meta name="luma-example-backends" content="webgpu,webgl2" />
  <meta name="luma-example-mobile" content="full" />
  <meta name="luma-example-mobile-profile" content="standard" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document.querySelectorAll('script[type="module"]:not([data-luma-example-support-bootstrap])').forEach(script => script.remove());
    }
  </script>
  <!-- /luma-example-support -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
  <title>Riverfront soft shadows · luma.gl</title>
</head>
<body>
  <div id="scene" aria-label="Riverfront with animated sunlight and soft shadows"></div>
  <aside class="luma-example-infobox luma-example-infobox--overlay">
    <p class="eyebrow">luma.gl + deck.gl</p>
    <h1>Riverfront soft shadows</h1>
    <section class="control-card"><h2>Sunlight</h2>
      <label>Device<select id="backend" aria-label="Device"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2</option></select></label>
      <label class="toggle"><input id="animated" type="checkbox" checked /> Animate time</label>
      <label>Time of day<input id="hour" type="range" min="0" max="24" step="0.01" value="6.5" /></label>
      <output id="time" class="selection">06:30 EDT</output>
      <label>Time speed<input id="speed" type="range" min="0.05" max="3" step="0.05" value="0.8" /></label>
    </section>
    <section class="control-card"><h2>Sky</h2>
      <label class="toggle"><input id="show-sun" type="checkbox" checked /> Sun</label>
      <label class="toggle"><input id="show-moon" type="checkbox" checked /> Moon</label>
      <div class="sky-actions"><button id="center" type="button">Center</button><button id="look-sun" type="button">Sun</button><button id="look-moon" type="button">Moon</button></div>
    </section>
    <section class="control-card"><h2>Atmosphere</h2>
      <label class="toggle"><input id="atmosphere" type="checkbox" checked /> Atmospheric sky</label>
      <label>Haze<input id="haze" type="range" min="0" max="5" step="0.1" value="1" /></label>
    </section>
    <section class="control-card"><h2>Clouds</h2>
      <label class="toggle"><input id="clouds" type="checkbox" checked /> Clouds</label>
      <label class="toggle"><input id="cloud-shadows" type="checkbox" checked /> Cloud shadows</label>
      <label class="toggle"><input id="cloud-animated" type="checkbox" checked /> Animate clouds</label>
      <label>Cloud cover<input id="cloud-cover" type="range" min="0" max="1" step="0.01" value="0.4" /></label>
      <label>Wind speed<input id="wind-speed" type="range" min="0" max="80" step="1" value="18" /></label>
      <label>Wind direction<input id="wind-direction" type="range" min="0" max="360" step="1" value="75" /></label>
    </section>
    <section class="control-card"><h2>Shadows</h2>
      <label class="toggle"><input id="shadows" type="checkbox" checked /> Soft shadows</label>
      <label>Softness<input id="softness" type="range" min="0" max="0.06" step="0.001" value="0.018" /></label>
      <label>Quality<select id="quality"><option value="low">Low</option><option value="balanced" selected>Balanced</option><option value="cinematic">Cinematic</option></select></label>
    </section>
    <output id="status" class="selection" aria-live="polite">Preparing the riverfront…</output>
    <p class="hint">Drag to move · Scroll to zoom<br />Shift + drag to orbit</p>
  </aside>
  <script type="module" src="./main.ts"></script>
</body>
</html>
