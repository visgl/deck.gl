<!doctype html>
<html lang="en">
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="deck/global-illumination" />
  <meta name="luma-example-backends" content="webgpu" />
  <meta name="luma-example-mobile" content="full" />
  <meta name="luma-example-mobile-profile" content="standard" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document.querySelectorAll('script[type="module"]:not([data-luma-example-support-bootstrap])').forEach(script => script.remove());
    }
  </script>
  <!-- /luma-example-support -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
  <title>Riverfront global illumination · luma.gl</title>
</head>
<body>
  <div id="scene" aria-label="Riverfront global illumination"></div>
  <aside class="luma-example-infobox luma-example-infobox--overlay">
    <p class="eyebrow">luma.gl + deck.gl</p><h1>Riverfront global illumination</h1>
    <section class="control-card"><h2>Scene</h2>
      <label>Device<select id="backend" aria-label="Device"><option value="webgpu">WebGPU</option></select></label>
      <label class="toggle">Animate<input id="animate" type="checkbox" checked /></label>
      <button id="center" type="button">Center</button>
    </section>
    <section class="control-card"><h2>Lighting</h2><label class="toggle">Indirect light<input id="enabled" type="checkbox" checked /></label><label>Bounce strength<input id="intensity" type="range" min="0.1" max="3" step="0.1" /></label><label>Bounce radius (m)<input id="radius" type="range" min="40" max="240" step="5" /></label><label>Exposure<input id="exposure" type="range" min="0.2" max="3" step="0.1" /></label></section>
    <section class="control-card"><h2>Shared buffers</h2><label>View<select id="buffer-view"><option value="0">Scene</option><option value="1">Normals</option><option value="2">Depth</option><option value="3">Motion</option></select></label></section>
    <output id="status" class="selection" aria-live="polite">Preparing the riverfront…</output>
    <p class="hint">Colored diffuse bounce from visible buildings using the existing screen-space GI graph.<br />Drag to move · Scroll to zoom · Shift + drag to orbit</p>
  </aside><script type="module" src="./main.ts"></script>
</body></html>
