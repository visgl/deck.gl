<!doctype html>
<html lang="en">
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="deck/pattern-fills" />
  <meta name="luma-example-backends" content="webgpu,webgl2" />
  <meta name="luma-example-mobile" content="full" />
  <meta name="luma-example-mobile-profile" content="standard" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document.querySelectorAll('script[type="module"]:not([data-luma-example-support-bootstrap])').forEach(script => script.remove());
    }
  </script>
  <!-- /luma-example-support -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
  <title>Riverfront patterns · luma.gl</title>
</head>
<body>
  <div id="scene" aria-label="Interactive patterned riverfront"></div>
  <aside class="luma-example-infobox luma-example-infobox--overlay">
    <p class="eyebrow">luma.gl + deck.gl</p><h1>Riverfront patterns</h1>
    <section class="control-card"><h2>Scene</h2>
      <label>Renderer<select id="backend"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2</option></select></label>
      <label class="toggle"><input id="enabled" type="checkbox" checked /> Pattern fill</label>
    </section>
    <section class="control-card"><h2>Surface</h2>
      <label>Pattern<select id="pattern"><option value="hatch">Hatch</option><option value="crosshatch">Crosshatch</option><option value="dots">Dots</option></select></label>
      <label>Spacing (m)<input id="spacing" type="range" min="1" max="24" step="0.5" value="8" /></label>
      <label>Ink width<input id="width" type="range" min="0" max="1" step="0.01" value="0.2" /></label>
      <label>Angle<input id="angle" type="range" min="-90" max="90" step="1" value="45" /></label>
    </section>
    <output id="selection" class="selection" aria-live="polite">Click a building to inspect</output>
    <p class="hint" id="status">Patterns stay attached to the surface.<br />Drag to move · Scroll to zoom<br />Shift + drag to orbit</p>
  </aside>
  <script type="module" src="./main.ts"></script>
</body>
</html>
