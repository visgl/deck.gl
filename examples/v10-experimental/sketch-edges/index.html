<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="icon" href="data:," /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Riverfront outlines · luma.gl</title>
<link rel="stylesheet" href="./style.css" /></head>
<body><div id="scene" aria-label="Interactive architectural sketch"></div><aside class="luma-example-infobox luma-example-infobox--overlay"><p class="eyebrow">luma.gl + deck.gl</p><h1>Riverfront outlines</h1>
<section class="control-card"><h2>Scene</h2><label>Renderer<select id="backend"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2</option></select></label><label>Ground<select id="ground"><option value="light">Light streets</option><option value="dark">Dark streets</option></select></label><label class="toggle"><input id="fills" type="checkbox" /> Building faces</label><label class="toggle"><input id="context" type="checkbox" checked /> Surroundings</label><label class="toggle"><input id="edges" type="checkbox" checked /> Edges</label></section>
<section class="control-card"><h2>Edges</h2><label>Geometry<select id="edge-mode"><option value="architectural">Architectural</option><option value="triangles">Triangle mesh</option></select></label><label>Crease angle<input id="angle" type="range" min="0" max="120" step="1" value="30" /></label></section>
<section class="control-card"><h2>Stroke</h2><label>Style<select id="style"><option value="sketch">Charcoal</option><option value="solid">Solid</option></select></label><label>Width<input id="width" type="range" min="1" max="6" step="0.1" value="3.1" /></label><label>Wobble<input id="jitter" type="range" min="0" max="3" step="0.05" value="0.65" /></label><label>Grain<input id="grain" type="range" min="0" max="0.9" step="0.05" value="0.9" /></label><label>Extension<input id="extension" type="range" min="0" max="15" step="1" value="5" /></label></section>
<output id="edge-count" aria-live="polite"></output><p class="hint" id="status">Drag to move · Scroll to zoom<br />Shift + drag to orbit · Click to inspect</p></aside><script type="module" src="./main.ts"></script></body></html>
