version: 2
sphinx:
  configuration: docs/conf.py
build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # CWD for readthedocs is repository root.
      - cp -r bindings/pydeck/* .
    post_create_environment:
      - pip install uv
    install:
      # The docs builder has no node: skip building the widget bundles. Deck.show() falls back to HTML.
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH SKIP_JUPYTER_BUILDER=1 uv pip install --no-cache-dir -e . -r requirements/requirements-dev.txt
