name: test

# Validate pull requests and merge groups; validate pushes only on master.
on:
  push:
    branches:
    - master
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [master]

permissions:
  contents: read

jobs:
  test-webgl-unit:
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn bootstrap

      - name: Build packages
        run: yarn build

      - name: Run lint and WebGL unit tests with coverage
        env:
          RENDER_TEST_DEVICE: webgl
        run: |
          yarn lint
          yarn ocular-test node react headless --coverage

      - name: Run tape backward compatibility smoke test
        run: yarn test-tape-compat

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
          parallel: true
          flag-name: webgl-unit

  test-webgpu:
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn bootstrap

      - name: Build packages
        run: yarn build

      - name: Run WebGPU unit tests
        env:
          RENDER_TEST_DEVICE: webgpu
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" yarn test-headless

  test-render:
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn bootstrap

      - name: Build packages
        run: yarn build

      - name: Run WebGL render tests with coverage
        env:
          RENDER_TEST_DEVICE: webgl
        run: yarn test-render --coverage

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
          parallel: true
          flag-name: webgl-render

      - name: Run WebGPU render tests
        env:
          RENDER_TEST_DEVICE: webgpu
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" yarn test-render

      - name: Upload render test failure images
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-test-failures
          path: |
            test/render/golden-images/*-fail.png
            test/render/golden-images/*-diff.png
            test/render/golden-images/**/*-fail.png
            test/render/golden-images/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

  test-coverage:
    needs: [test-webgl-unit, test-render]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require both coverage shards
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = success,success

      - name: Finish Coveralls parallel build
        if: always()
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
          parallel-finished: true

  test-website:
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn bootstrap

      # test-website builds the packages from source before building the site.
      - name: Test website build
        run: |
          yarn test-website

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: |
          cd bindings/pydeck
          make setup-env
          make init
          cd ../pydeck-carto
          make init

      - name: Run pydeck tests
        run: |
          cd bindings/pydeck
          make ci

      - name: Run pydeck-carto tests
        run: |
          cd bindings/pydeck-carto
          make ci

  test-projection-domains-example:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable yarn
      - name: Test projection preprocessing and build worker
        working-directory: examples/experimental/projection-domains
        run: |
          yarn --ignore-scripts
          yarn test
          yarn build
